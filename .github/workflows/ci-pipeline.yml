name: Production CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  validate-and-build:

    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    # -----------------------------
    # Docker Setup
    # -----------------------------

    - name: Set Up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Verify Docker Installation
      run: docker --version

    # -----------------------------
    # Build Docker Image
    # -----------------------------

    - name: Build Docker Image
      run: |
        docker build \
        -t production-app:latest \
        ./app/nginx

    # -----------------------------
    # Terraform Setup
    # -----------------------------

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Verify Terraform Installation
      run: terraform version

    # -----------------------------
    # Terraform Validation
    # -----------------------------

    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    - name: Terraform Format Check
      working-directory: terraform
      run: terraform fmt -check

    - name: Terraform Validate
      working-directory: terraform
      run: terraform validate

    # -----------------------------
    # Kubernetes Manifest Validation
    # -----------------------------

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.29.0'

    - name: Validate Kubernetes Manifests
      run: |
        kubectl apply \
        --dry-run=client \
        -f kubernetes/base/deployment.yaml

        kubectl apply \
        --dry-run=client \
        -f kubernetes/base/service.yaml

        kubectl apply \
        --dry-run=client \
        -f kubernetes/base/ingress.yaml

        kubectl apply \
        --dry-run=client \
        -f kubernetes/base/hpa.yaml

    # -----------------------------
    # YAML Validation
    # -----------------------------

    - name: YAML Lint Validation
      uses: ibiqlik/action-yamllint@v3
      with:
        file_or_dir: kubernetes/

    # -----------------------------
    # Success Message
    # -----------------------------

    - name: Pipeline Status
      run: echo "Production CI pipeline completed successfully"